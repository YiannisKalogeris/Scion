[package]
name = "simulacrum-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "_rust_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"               # PyO3 NumPy interop
ndarray = "0.16"             # N-dimensional arrays
sprs = "0.11"                # Sparse matrices
rayon = "1.10"               # Parallel iterators

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"
