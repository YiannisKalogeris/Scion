# Pinned so a rebuild years from now reproduces the published kernels.
# targets: the Anaconda interpreter on this machine is x86_64 while the host
# is arm64, and without the matching target the build fails with the opaque
# "can't find crate for `std`".
[toolchain]
channel = "1.90.0"
# rust-analyzer is pinned with the toolchain because the VS Code extension
# ships its own, built against a newer compiler than the one pinned here,
# and warns that it cannot work properly against 1.90.0. Listing the
# component makes the editor use the matching version; it changes no
# codegen, so the pin above still reproduces the published kernels.
components = ["rustfmt", "clippy", "rust-analyzer"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
